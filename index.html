<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Imut</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #ffd6e0, #cde7ff);
        }
        .card {
            border-radius: 20px;
            width: 380px;
            margin: auto;
            margin-top: 100px;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="card shadow">
    <h3 class="text-center">Form Imut</h3>

    <form id="formData">
        <div class="mb-3">
            <label>Nama</label>
            <input type="text" id="nama" class="form-control">
        </div>

        <div class="mb-3">
            <label>Kelas</label>
            <input type="text" id="kelas" class="form-control">
        </div>

        <div class="mb-3">
            <label>Gender</label><br>
            <input type="radio" name="gender" value="Laki-laki"> Laki-laki <br>
            <input type="radio" name="gender" value="Perempuan"> Perempuan
        </div>

        <button type="submit" class="btn btn-primary w-100">Submit</button>
    </form>

    <div id="hasil" class="mt-3"></div>
</div>

<!-- SCRIPT -->
<script src="nama.js"></script>
<script src="kelas.js"></script>
<script src="gender.js"></script>

</body>
</html>
